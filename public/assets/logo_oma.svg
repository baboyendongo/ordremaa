
<svg width="300" height="120" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5c1c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c3a35b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a5c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c3a35b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a5c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4f4f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9e4d5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#accentGradient)" stroke="url(#primaryGradient)" stroke-width="2" filter="url(#shadow)"/>
  <g transform="translate(35, 25)">
    <rect x="0" y="20" width="50" height="30" fill="url(#primaryGradient)" rx="2" filter="url(#glow)"/>
    <rect x="5" y="25" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="18" y="25" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="31" y="25" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="44" y="25" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="5" y="38" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="18" y="38" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="31" y="38" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="44" y="38" width="8" height="8" fill="url(#accentGradient)" rx="1"/>
    <rect x="20" y="45" width="10" height="5" fill="url(#secondaryGradient)" rx="1"/>
    <polygon points="0,20 25,5 50,20" fill="url(#secondaryGradient)" filter="url(#glow)"/>
    <line x1="0" y1="15" x2="50" y2="15" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="10" x2="50" y2="10" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.5"/>
  </g>
  <g font-family="'Inter', 'Arial', sans-serif" font-weight="bold">
    <text x="130" y="35" font-size="28" fill="url(#primaryGradient)" filter="url(#shadow)">OMA</text>
    <text x="130" y="55" font-size="16" fill="url(#primaryGradient)" font-weight="600">Ordre Mauritanien</text>
    <text x="130" y="75" font-size="16" fill="url(#primaryGradient)" font-weight="600">des Architectes</text>
    <text x="130" y="95" font-size="12" fill="url(#secondaryGradient)" font-weight="400" opacity="0.8">MAURITANIE</text>
  </g>
  <circle cx="280" cy="25" r="3" fill="url(#secondaryGradient)" opacity="0.6"/>
  <circle cx="285" cy="20" r="2" fill="url(#primaryGradient)" opacity="0.4"/>
  <circle cx="130" cy="105" r="2" fill="url(#secondaryGradient)" opacity="0.5"/>
  <circle cx="135" cy="110" r="1.5" fill="url(#primaryGradient)" opacity="0.3"/>
  <line x1="120" y1="60" x2="125" y2="60" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="80" x2="125" y2="80" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.6"/>
  <line x1="130" y1="85" x2="290" y2="85" stroke="url(#secondaryGradient)" stroke-width="1" opacity="0.4"/>
  <line x1="130" y1="88" x2="250" y2="88" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.3"/>
</svg>
