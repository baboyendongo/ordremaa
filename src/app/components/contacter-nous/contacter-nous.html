<section class="contact-section">
  <div class="contact-header">
    <h2>Contactez-nous</h2>
    <p>Une question, un projet, une demande ? L’équipe de l’Ordre Mauritanien des Architectes est à votre écoute.</p>
  </div>
  <div class="contact-content">
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Votre email" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Votre message" required></textarea>
      </div>
      <button type="submit" class="contact-btn">Envoyer</button>
    </form>
    <div class="contact-infos">
      <h3>Coordonnées</h3>
      <p><strong>Adresse :</strong> Avenue de l’Indépendance, Nouakchott, Mauritanie</p>
      <p><strong>Téléphone :</strong> +222 12 34 56 78</p>
      <p><strong>Email :</strong> contact</p>
      <div class="contact-map">
        <iframe src="https://www.google.com/maps?q=Nouakchott,+Mauritanie&output=embed" width="100%" height="220" style="border:0; border-radius:12px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>
</section>
